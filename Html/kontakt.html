<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>KartParts — Log In</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../CSS/kontakt.css"/>
</head>
<body>

  <!-- navbar -->
  <nav>
    <a href="gokart.html" class="nav-logo">Kart<span>Parts</span></a>
  </nav>

  <!-- login box i mitten av sidan -->
  <main>
    <div class="login-box">

      <h1>Log In</h1>
      <p class="login-sub">Welcome back — sign in to your account</p>

      <!-- username fält -->
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="Your username"/>
      </div>

      <!-- mejl fält -->
      <div class="field">
        <label for="email">Email</label>
        <input type="text" id="email" placeholder="your@email.com"/>
        <!-- felmeddelande visas av JS -->
        <p class="error-msg hidden" id="emailError">Invalid email — must contain @</p>
      </div>

      <!-- login knapp -->
      <button class="login-btn" id="loginBtn">Log In</button>

      <!-- success meddelande (dolt från start) -->
      <p class="success-msg hidden" id="successMsg">✅ Logged in successfully!</p>

    </div>
  </main>

  <script src="../Java script/kontakt.js"></script>
</body>
</html>
