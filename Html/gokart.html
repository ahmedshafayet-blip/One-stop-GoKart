<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>One-Stop-Gokart</title> 
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../CSS/gokart.css"/>
</head>
<body>
  <nav id="navbar">
    <a href="gokart.html" class="nav-logo">Kart<span>Parts</span></a>
    <div class="nav-right">
  <!-- Search bar -->
      <div class="search-wrap">
        <input type="text" id="searchInput" placeholder="Search parts…" autocomplete="off"/>
        <span class="search-icon">
          <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <circle cx="11" cy="11" r="8"/>
            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
        </span>
      </div>

      <a href="cart.html" class="cart-btn" id="cartBtn" title="View cart">
        🛒
        <span class="cart-badge" id="cartBadge">0</span>
      </a>

      <!-- Hamburger button -->
      <button class="burger-btn" id="burgerBtn" aria-label="Open menu">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </nav>

  <!-- pop up meny -->
  <div class="menu-overlay" id="menuOverlay">
    <div class="menu-panel">
      <h3>Menu</h3>
      <a href="kontakt.html" class="menu-link">Profile</a>
    </div>
  </div>
 
  <!-- hero banner -->
  <section class="hero-banner">
    <h1>
      One Stop, Gokart Shop.
    </h1>
    <p>Everything you need to build, tune, and race your go-kart at the highest level. Right from the best manufacturers.</p>
    <div class="hero-stats">
      <div class="hero-stat">
        <span class="hero-stat-num">50+</span>
        <span class="hero-stat-label">Parts in stock</span>
      </div>
      <div class="hero-stat">
        <span class="hero-stat-num">In 7 days</span>
        <span class="hero-stat-label">Fast shipping</span>
      </div>
      <div class="hero-stat">
        <span class="hero-stat-num">8</span>
        <span class="hero-stat-label">Categories</span>
      </div>
    </div>
  </section>
 
  <!-- produkt filter -->
  <div class="filter-bar" id="filterBar">
    <button class="filter-chip active" data-filter="all">All</button>
    <button class="filter-chip" data-filter="engine">Engine</button>
    <button class="filter-chip" data-filter="steering">Steering</button>
    <button class="filter-chip" data-filter="tyres">Tyres</button>
    <button class="filter-chip" data-filter="brakes">Brakes</button>
    <button class="filter-chip" data-filter="axle">Axle</button>
    <button class="filter-chip" data-filter="bodywork">Bodywork</button>
    <button class="filter-chip" data-filter="apparel">Apparel</button>
    <button class="filter-chip" data-filter="electronics">Electronics</button>
  </div>
 
  <!-- produkter -->
  <section class="shop-section">
    <div class="section-label">Featured Products</div>
    <p class="no-results hidden" id="noResults">No products match your search.</p>
 
    <div class="products-grid" id="productsGrid"> </div>
  </section>
 
  <script src="../Java script/products.js"></script>
  <script src="../Java script/gokart.js"></script>
</body>
</html>
